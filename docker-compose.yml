services:
  yugabyte:
    image: yugabytedb/yugabyte:2.25.2.0-b359
    command: ["bin/yugabyted", "start", "--background=false"]
    ports: ["5434:5433"]
    healthcheck:
      test: ["CMD-SHELL", "ysqlsh -h 127.0.0.1 -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  vault:
    image: hashicorp/vault:1.18
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: local-dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["server", "-dev"]
    ports: ["8200:8200"]

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    profiles: ["kafka"]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    profiles: ["kafka"]
