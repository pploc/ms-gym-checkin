name: CI

on:
  push:
    branches: [develop, main, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish immutable source-SHA image from develop
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  go-ci:
    name: Lint, tests, coverage
    uses: pploc/gym-infra/.github/workflows/go-ci.yml@ace7a285cc14b3e1121cac17bcfa9ea0ce5d1102
    with:
      service_path: .
      go_version: '1.26.6'
      coverage_min: '30'
      coverpkg: ./internal/...
    secrets: inherit

  integration:
    name: Integration tests and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: go.sum
      - uses: actions/checkout@v4
        with:
          repository: pploc/gym-proto
          ref: v7.0.2
          path: gym-proto
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
      - name: Configure private Go modules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GOPRIVATE=github.com/pploc/*
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gym-private-modules.gitconfig"
          umask 077
          cat > "$GIT_CONFIG_GLOBAL" <<EOF
          [url "https://x-access-token:${GITHUB_TOKEN}@github.com/"]
              insteadOf = https://github.com/
          EOF
          printf 'GOPRIVATE=%s\nGIT_CONFIG_GLOBAL=%s\n' "$GOPRIVATE" "$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
      - name: Verify modules
        run: GOWORK=off go mod verify
      - name: Start dependencies
        run: make start-env
      - name: Apply migrations
        env:
          DATABASE_URL: postgres://yugabyte@127.0.0.1:5434/checkin_db?sslmode=disable
        run: make migrate
      - name: Seed disposable Registry fixtures
        working-directory: gym-proto
        run: |
          set -euo pipefail
          sed -i 's/\r$//' gradlew
          buf generate
          ./gradlew seedConfluentSchemas -PschemaRegistryUrl=http://127.0.0.1:8081 --no-daemon
      - name: Integration tests
        env:
          DATABASE_URL: postgres://yugabyte@127.0.0.1:5434/checkin_db?sslmode=disable
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          KMS_KEY_ID: alias/checkin-root
          KMS_ENDPOINT_URL: http://127.0.0.1:4566
          KAFKA_BROKERS: 127.0.0.1:9092
          SCHEMA_REGISTRY_URL: http://127.0.0.1:8081
          UNSEEDED_SCHEMA_REGISTRY_URL: http://127.0.0.1:8082
        run: GOWORK=off go test -tags=integration -race ./test/integration/...
      - name: Vulnerability scan
        run: GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Stop dependencies and remove private Go module credentials
        if: always()
        run: |
          make stop-env
          rm -f "$RUNNER_TEMP/gym-private-modules.gitconfig"

  docker-check:
    name: Build image
    needs: [go-ci, integration]
    uses: pploc/gym-infra/.github/workflows/docker-build.yml@ace7a285cc14b3e1121cac17bcfa9ea0ce5d1102
    with:
      service_name: ms-gym-checkin
      context: .
      push: false
      source_sha_only: true
    permissions:
      contents: read
      packages: read

  docker-publish:
    name: Publish image
    needs: [docker-check]
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_image &&
      github.ref == 'refs/heads/develop'
    uses: pploc/gym-infra/.github/workflows/docker-build.yml@ace7a285cc14b3e1121cac17bcfa9ea0ce5d1102
    with:
      service_name: ms-gym-checkin
      context: .
      push: true
      source_sha_only: true
      max_tags: 20
    permissions:
      contents: read
      packages: write
